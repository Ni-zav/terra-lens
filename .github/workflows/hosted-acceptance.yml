name: Hosted Preview & Production Acceptance (read-only)
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Hosted HTTPS URL to validate'
        required: false
        default: 'https://ni-zav.github.io/terra-lens-preview/'
      expected_commit:
        description: 'Optional 40-char commit SHA expected in BUILD-PROVENANCE.txt'
        required: false
        default: ''
  push:
    paths:
      - 'scripts/hosted-acceptance.mjs'
      - '.github/workflows/hosted-acceptance.yml'
permissions:
  contents: read
jobs:
  hosted-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test hosted review preview against real NASA data and BUILD-PROVENANCE.txt
        env:
          TERRA_HOSTED_URL: ${{ inputs.target_url || 'https://ni-zav.github.io/terra-lens-preview/' }}
          # The submitted preview intentionally remains pinned to the final PR source SHA.
          # A merge commit on main has a different SHA but contains the same release tree.
          # Avoid comparing the frozen preview to github.sha from subsequent main pushes.
          TERRA_EXPECTED_COMMIT: ${{ inputs.expected_commit || ((inputs.target_url == '' || inputs.target_url == 'https://ni-zav.github.io/terra-lens-preview/') && '662a33a8d9b34cd691e43c80572f73dbea004784' || '') }}
        run: node scripts/hosted-acceptance.mjs
      - name: Upload screenshots and summary JSON even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-preview-acceptance
          path: |
            artifacts/hosted-*.png
            artifacts/hosted-acceptance-summary.json
          if-no-files-found: ignore
