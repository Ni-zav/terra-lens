name: Experimental live NASA variable metadata
on:
  push:
    branches: [experiment/nasa-cmr-variables-20261115]
permissions:
  contents: read
jobs:
  live-variables:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/live-cmr-variables.mjs
