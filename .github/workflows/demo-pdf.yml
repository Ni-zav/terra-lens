name: Build Seven-Slide Demo PDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'demo/index.html'
      - 'demo/*.png'
      - 'demo/*.jpg'
      - 'scripts/build-demo.mjs'
      - '.github/workflows/demo-pdf.yml'
      - 'docs/screenshots/nasa-real-desktop.png'
concurrency:
  group: terra-lens-pdf-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  create-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install pypdf
      - name: Render evidence-backed HTML as PDF
        run: node scripts/build-demo.mjs
      - name: Enforce the official 7 slide limit
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p='demo/Terra-Lens_Seven_Slide_Demo.pdf'
          count=len(PdfReader(p).pages)
          print(f"Demo PDF pages: {count}")
          assert count==7, f"Official demo limit: 7 slides; generated {count}"
          PY
      - name: Commit regenerated PDF on review branches only
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/Terra-Lens_Seven_Slide_Demo.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(demo): sync generated verified seven-slide PDF'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload verified demo PDF
        uses: actions/upload-artifact@v4
        with:
          name: terra-lens-demo-pdf
          path: demo/Terra-Lens_Seven_Slide_Demo.pdf
