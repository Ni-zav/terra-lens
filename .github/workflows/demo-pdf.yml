name: Build Seven-Slide Demo PDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'demo/index.html'
      - 'demo/*.png'
      - 'demo/*.jpg'
      - 'scripts/build-demo.mjs'
      - '.github/workflows/demo-pdf.yml'
      - 'docs/screenshots/nasa-real-desktop.png'
concurrency:
  group: terra-lens-pdf-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  create-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install pypdf
      - name: Check committed PDF page count
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          assert len(PdfReader('demo/Terra-Lens_Seven_Slide_Demo.pdf').pages)==7
          PY
      - name: Render evidence-backed HTML as PDF
        run: node scripts/build-demo.mjs
      - name: Enforce the official 7 slide limit
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p='demo/Terra-Lens_Seven_Slide_Demo.pdf'
          count=len(PdfReader(p).pages)
          print(f"Demo PDF pages: {count}")
          assert count==7, f"Official demo limit: 7 slides; generated {count}"
          PY
      - name: Upload verified demo PDF
        uses: actions/upload-artifact@v4
        with:
          name: terra-lens-demo-pdf
          path: |
            demo/Terra-Lens_Seven_Slide_Demo.pdf
            artifacts/demo-print-slide-*.png
