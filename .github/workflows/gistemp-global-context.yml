name: NASA GISS and POWER global-local scientific context
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/science/gistemp.js'
      - 'scripts/live-gistemp-context.mjs'
      - 'scripts/verify-gistemp-python.py'
      - '.github/workflows/gistemp-global-context.yml'
  push:
    paths:
      - 'src/science/gistemp.js'
      - 'scripts/live-gistemp-context.mjs'
      - 'scripts/verify-gistemp-python.py'
      - '.github/workflows/gistemp-global-context.yml'
permissions:
  contents: read
jobs:
  real-source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download NASA GISTEMP global monthly and NASA POWER local point
        run: node scripts/live-gistemp-context.mjs
      - name: Independently verify baselines, annual means and slopes
        run: python scripts/verify-gistemp-python.py
      - name: Preserve actual NASA global/local records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-giss-power-actual-cross-source-data
          path: artifacts/gistemp-power-global-local.json
          if-no-files-found: ignore
