name: Experimental live NASA CMR browser
on:
  workflow_dispatch:
  push:
    branches: [experiment/nasa-cmr-discovery-20261115, fix/final-science-site-deck-readiness-20261115]
permissions:
  contents: read
jobs:
  live-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/live-cmr-browser.mjs
      - name: Test public review preview
        run: node scripts/live-cmr-browser.mjs
        env:
          CMR_TEST_URL: https://ni-zav.github.io/terra-lens-preview/
