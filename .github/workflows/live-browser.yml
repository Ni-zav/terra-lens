name: Live NASA Browser Evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-browser.mjs'
      - '.github/workflows/live-browser.yml'
permissions:
  contents: write
jobs:
  browser-real-nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render and test real NASA data end to end
        run: node scripts/live-browser.mjs
      - name: Upload authentic NASA browser screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terra-lens-live-browser-screenshots
          path: docs/screenshots/
      - name: Publish screenshots if unchanged main branch
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: publish actual NASA browser evidence screenshots'
          git push origin HEAD:main
