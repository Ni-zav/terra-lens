name: Live NASA Browser Evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-browser.mjs'
      - '.github/workflows/live-browser.yml'
      - 'src/react/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/globe.js'
      - 'src/power.js'
      - 'src/stats.js'
      - 'assets/**'
      - 'functions/api/power.js'
      - 'index.html'
      - 'styles/**'
concurrency:
  group: terra-lens-live-evidence-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-real-nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and build
        run: |
          npm ci
          npm run build
      - name: Install Chromium browser harness
        run: |
          npx playwright install --with-deps chromium
      - name: Render and test real NASA data end to end
        run: node scripts/live-browser.mjs
      - name: Upload authentic NASA browser screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terra-lens-live-browser-screenshots
          path: docs/screenshots/
